<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Último Bocado - Mi Carrito</title>
    <link rel="icon" type="image/svg+xml" href="images/logo_ultimo_bocado.svg">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="pedido-page">

<header class="site-header">
    <div class="brand">
        <a href="index.html"><img class="logo" src="images/logo_ultimo_bocado.png" alt="Logo Último Bocado"></a>
    </div>

    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-toggle-label">☰</label>

    <nav class="navbar">
        <a href="index.html">Inicio</a>
        <a href="menu.html">Menú</a>
        <a href="ofertas.html">Ofertas</a>
        <a href="pedidos.html">Mis Pedidos</a>
        <a href="login.html">Ingresar</a>
        <a href="form_pedido.html" class="nav-btn-carrito">🛒 Mi Carrito</a>
    </nav>
</header>

<main>

    <section class="page-grid">
        <div class="form-card card">
            <h2 class="hero-title">Finalizar Reserva</h2>
            <p class="subtitle">Selecciona los platos que deseas rescatar y prepárate para recogerlos en el local.</p>
            
            <form action="#" method="POST">
                <div class="form-row">
                    <div class="form-group flex-1">
                        <label for="cliente">Nombre completo</label>
                        <input type="text" id="cliente" name="cliente" placeholder="Ejemplo: Lucía Ramos" required>
                    </div>
                    <div class="form-group flex-1">
                        <label for="telefono">Teléfono de contacto</label>
                        <input type="tel" id="telefono" name="telefono" placeholder="999 999 999" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="notas">Notas para el local (Opcional)</label>
                    <input type="text" id="notas" name="notas" placeholder="Ejemplo: Llegaré 10 minutos antes del cierre">
                </div>
                
                <div class="form-group">
                    <label>Selección de platos a rescatar</label>
                    <div class="checkbox-list">
                        <div class="checkbox-group mt-10">
                            <input type="checkbox" id="plato1" name="plato" value="Ensalada de pollo">
                            <label for="plato1">Ensalada de pollo (Cafetería Aurora)</label>
                        </div>
                        <div class="checkbox-group mt-10">
                            <input type="checkbox" id="plato2" name="plato" value="Pack de panes">
                            <label for="plato2">Pack de panes dulces (Panadería Sol)</label>
                        </div>
                        <div class="checkbox-group mt-10">
                            <input type="checkbox" id="plato3" name="plato" value="Chaufa">
                            <label for="plato3">Chaufa vegetariano (Menú Casero Lili)</label>
                        </div>
                        <div class="checkbox-group mt-10">
                            <input type="checkbox" id="plato4" name="plato" value="Combo sopa">
                            <label for="plato4">Combo sopa y guiso (Sazón Norteña)</label>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="cantidad">Cantidad total de packs</label>
                    <select id="cantidad" name="cantidad" required>
                        <option value="1">1 unidad</option>
                        <option value="2">2 unidades</option>
                        <option value="3">3 unidades</option>
                        <option value="4">4 unidades</option>
                    </select>
                </div>
                
                <button type="submit" class="btn btn-full">Confirmar Reserva</button>
            </form>
            
            <div class="form-footer">
                <p><a href="menu.html" class="text-orange link-bold">Seguir viendo el menú</a></p>
            </div>
        </div>
        
        <div class="img-container">
            <img class="hero-img" src="images/pedido_ilustracion.png" alt="Ilustración de carrito de compras">
        </div>
    </section>

</main>

<footer class="site-footer">
    <div class="footer-content">
        <p><strong>Último Bocado &copy; 2026</strong></p>
        <p>Contacto: contacto@ultimobocado.pe<br>Instagram: @ultimobocado.pe | Facebook: Último Bocado Perú</p>
    </div>
</footer>
</body>
</html>
